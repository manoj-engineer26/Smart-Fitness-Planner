<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Details | Smart Fitness Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <p class="step">STEP 1 OF 3</p>

        <h1>Tell Us About Yourself</h1>

        <p>
            Enter your basic details to create your personalized fitness plan.
        </p>

    </header>


    <main class="container">

        <section class="card">

            <h2>Personal Details</h2>

            <form id="fitnessForm">

                <div>
                    <label for="age">Age</label>

                    <input
                        type="number"
                        id="age"
                        placeholder="e.g. 21"
                        min="13"
                        max="100"
                        required
                    >
                </div>


                <div>
                    <label for="weight">Weight (kg)</label>

                    <input
                        type="number"
                        id="weight"
                        placeholder="e.g. 65"
                        min="20"
                        max="300"
                        required
                    >
                </div>


                <div>
                    <label for="height">Height (cm)</label>

                    <input
                        type="number"
                        id="height"
                        placeholder="e.g. 170"
                        min="100"
                        max="250"
                        required
                    >
                </div>


                <div>
                    <label for="gender">Gender</label>

                    <select id="gender" required>

                        <option value="">
                            Select gender
                        </option>

                        <option value="male">
                            Male
                        </option>

                        <option value="female">
                            Female
                        </option>

                    </select>
                </div>


                <div>
                    <label for="activity">
                        Activity Level
                    </label>

                    <select id="activity" required>

                        <option value="">
                            Select activity level
                        </option>

                        <option value="sedentary">
                            Sedentary - Little exercise
                        </option>

                        <option value="light">
                            Lightly Active - 1–3 days/week
                        </option>

                        <option value="moderate">
                            Moderately Active - 3–5 days/week
                        </option>

                        <option value="active">
                            Very Active - 6–7 days/week
                        </option>

                    </select>
                </div>


                <div>
                    <label for="goal">
                        Fitness Goal
                    </label>

                    <select id="goal" required>

                        <option value="">
                            Select your goal
                        </option>

                        <option value="lose">
                            Lose Weight
                        </option>

                        <option value="maintain">
                            Maintain Weight
                        </option>

                        <option value="gain">
                            Gain Weight
                        </option>

                    </select>
                </div>


                <button type="submit">
                    Create My Fitness Plan →
                </button>

            </form>

        </section>


        <section class="motivation-card">

            <p>
                "Your body can do it. It's your mind you have to convince."
            </p>

        </section>

    </main>


    <footer>

        <p>
            Small steps every day lead to big results.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
